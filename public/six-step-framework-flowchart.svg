<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1260" width="900" height="1260" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#888"/></marker>
<marker id="b" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7A4E8C"/></marker></defs>
<rect width="900" height="1260" fill="#F7F5F0"/>
<text x="450" y="55" text-anchor="middle" font-size="30" font-weight="700" fill="#1F3A4D">Reclaiming Your Hunger</text>
<text x="450" y="88" text-anchor="middle" font-size="17" fill="#555">The Six-Step Framework · Hunger Management Model</text>
<text x="450" y="115" text-anchor="middle" font-size="14" font-style="italic" fill="#777">From uncontrolled emergency to an accurate, manageable signaling system</text>
<rect x="120" y="150" width="660" height="115" rx="14" fill="#fff" stroke="#2E6E8E" stroke-width="2.5"/><circle cx="120" cy="190" r="26" fill="#2E6E8E"/><text x="120" y="199" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">1</text><text x="165" y="188" font-size="22" font-weight="700" fill="#2E6E8E">Map Your Baseline Signals</text><text x="165" y="216" font-size="16" fill="#333">Differentiate true homeostatic hunger from hedonic cravings and</text><text x="165" y="237" font-size="16" fill="#333">environmental triggers.</text><line x1="450" y1="269" x2="450" y2="295" stroke="#888" stroke-width="2.5" marker-end="url(#a)"/><rect x="120" y="305" width="660" height="180" rx="14" fill="#fff" stroke="#3A7D6B" stroke-width="2.5"/><circle cx="120" cy="345" r="26" fill="#3A7D6B"/><text x="120" y="354" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">2</text><text x="165" y="343" font-size="22" font-weight="700" fill="#3A7D6B">Identify Your Phenotype</text><text x="165" y="371" font-size="16" fill="#333">Pinpoint how your internal hunger processing has been altered.</text><rect x="165" y="405" width="138" height="60" rx="8" fill="#3A7D6B" opacity="0.12" stroke="#3A7D6B"/><text x="234" y="428" text-anchor="middle" font-size="15" font-weight="700" fill="#3A7D6B">Accurate</text><text x="234" y="450" text-anchor="middle" font-size="10.5" fill="#444">Signals match needs</text><rect x="313" y="405" width="138" height="60" rx="8" fill="#B07A2A" opacity="0.12" stroke="#B07A2A"/><text x="382" y="428" text-anchor="middle" font-size="15" font-weight="700" fill="#B07A2A">Distorted</text><text x="382" y="450" text-anchor="middle" font-size="10.5" fill="#444">Sluggish hormonal feedback</text><rect x="461" y="405" width="138" height="60" rx="8" fill="#B5533C" opacity="0.12" stroke="#B5533C"/><text x="530" y="428" text-anchor="middle" font-size="15" font-weight="700" fill="#B5533C">Hijacked</text><text x="530" y="450" text-anchor="middle" font-size="10.5" fill="#444">UPFs &amp; stress override satiety</text><rect x="609" y="405" width="138" height="60" rx="8" fill="#6B4E71" opacity="0.12" stroke="#6B4E71"/><text x="678" y="428" text-anchor="middle" font-size="15" font-weight="700" fill="#6B4E71">Collapsed</text><text x="678" y="450" text-anchor="middle" font-size="10.5" fill="#444">Dulled energy regulation</text><line x1="450" y1="489" x2="450" y2="515" stroke="#888" stroke-width="2.5" marker-end="url(#a)"/><rect x="120" y="525" width="660" height="115" rx="14" fill="#fff" stroke="#4F8A3F" stroke-width="2.5"/><circle cx="120" cy="565" r="26" fill="#4F8A3F"/><text x="120" y="574" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">3</text><text x="165" y="563" font-size="22" font-weight="700" fill="#4F8A3F">Establish Structural Anchors</text><text x="165" y="591" font-size="16" fill="#333">Remove decision fatigue with predictable meal timing, composition,</text><text x="165" y="612" font-size="16" fill="#333">and kitchen design.</text><line x1="450" y1="644" x2="450" y2="670" stroke="#888" stroke-width="2.5" marker-end="url(#a)"/><rect x="120" y="680" width="660" height="115" rx="14" fill="#fff" stroke="#B07A2A" stroke-width="2.5"/><circle cx="120" cy="720" r="26" fill="#B07A2A"/><text x="120" y="729" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">4</text><text x="165" y="718" font-size="22" font-weight="700" fill="#B07A2A">Deconstruct Cue-Driven Triggers</text><text x="165" y="746" font-size="16" fill="#333">Isolate external and emotional drivers (sights, habits, social</text><text x="165" y="767" font-size="16" fill="#333">settings, stress, boredom) from internal need.</text><line x1="450" y1="799" x2="450" y2="825" stroke="#888" stroke-width="2.5" marker-end="url(#a)"/><rect x="120" y="835" width="660" height="180" rx="14" fill="#fff" stroke="#B5533C" stroke-width="2.5"/><circle cx="120" cy="875" r="26" fill="#B5533C"/><text x="120" y="884" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">5</text><text x="165" y="873" font-size="22" font-weight="700" fill="#B5533C">Match Intervention Tiers</text><text x="165" y="901" font-size="16" fill="#333">Apply the right level of support for your phenotype's severity.</text><rect x="165" y="940" width="140" height="48" rx="8" fill="#B5533C" opacity="0.35"/><text x="235.0" y="969" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">Lifestyle structure</text><text x="315" y="971" text-anchor="middle" font-size="18" fill="#B5533C">›</text><rect x="325" y="940" width="150" height="48" rx="8" fill="#B5533C" opacity="0.6499999999999999"/><text x="400.0" y="969" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">Behavioral rewiring</text><text x="485" y="971" text-anchor="middle" font-size="18" fill="#B5533C">›</text><rect x="495" y="940" width="270" height="48" rx="8" fill="#B5533C" opacity="0.95"/><text x="630.0" y="969" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">Clinical / pharmacologic / metabolic support</text><line x1="450" y1="1019" x2="450" y2="1045" stroke="#888" stroke-width="2.5" marker-end="url(#a)"/><rect x="120" y="1055" width="660" height="115" rx="14" fill="#fff" stroke="#7A4E8C" stroke-width="2.5"/><circle cx="120" cy="1095" r="26" fill="#7A4E8C"/><text x="120" y="1104" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">6</text><text x="165" y="1093" font-size="22" font-weight="700" fill="#7A4E8C">Practice In-the-Moment Check-Ins</text><text x="165" y="1121" font-size="16" fill="#333">Before eating: rate fullness 1–10 and ask — physical cue or</text><text x="165" y="1142" font-size="16" fill="#333">emotional trigger?</text><path d="M780 1115 H835 V190 H790" fill="none" stroke="#7A4E8C" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#b)"/><text x="858" y="652.5" font-size="15" font-style="italic" fill="#7A4E8C" text-anchor="middle" transform="rotate(90 858 652.5)">Ongoing dialogue with your biology — repeat the loop</text>
<text x="450" y="1225" text-anchor="middle" font-size="14" fill="#555">Biological · Cue-Driven · Structural</text>
<text x="450" y="1246" text-anchor="middle" font-size="12" fill="#888">From Silent Killers No More — Bruce Thompson, MD</text>
</svg>